name: Build Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Icône de l'application
        run: |
          cd android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          cp -r "$GITHUB_WORKSPACE"/android-icons/mipmap-* .
      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Gestion-Minervals.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Minervals-APK
          path: Gestion-Minervals.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: APK Android (build ${{ github.run_number }})
          files: Gestion-Minervals.apk
