V.db=()=>{let kb=Math.max(1,Math.round(JSON.stringify(D).length/1024)),sn=snaps(),last=D.s.lastBackup?new Date(D.s.lastBackup).toLocaleString('fr-FR'):'Aucune sauvegarde effectuée',c=D.cloud,on=c.url&&c.key&&c.email;
 const box=(ic,t,body,acts)=>`<section class="card"><div class="dbx"><span class="ic">${I(ic,22)}</span><div><h3>${t}</h3>${body}</div></div><div class="acts">${acts}</div></section>`;
 return HDR('Base de données & Sauvegardes','Stockage interne de l’appareil, sauvegarde en ligne (cloud) et conservation en lieu sûr.')+`<div class="stats"><div class="stat"><span class="ic">${I('users',22)}</span><div><b>${D.el.length}</b><span>élèves enregistrés</span></div></div><div class="stat"><span class="ic">${I('users',22)}</span><div><b>${D.ag.length}</b><span>agents enregistrés</span></div></div><div class="stat"><span class="ic">${I('db',22)}</span><div><b>${kb} Ko</b><span>taille de la base</span></div></div><div class="stat"><span class="ic y">${I('shield',22)}</span><div><b>${sn.length?new Date(sn[0].t).toLocaleDateString('fr-FR'):'—'}</b><span>copie auto interne</span></div></div></div>`
 +box('db','1. Stockage interne de l’application',`<p>Emplacement actif : <b>mémoire de cet appareil (données) et base interne (pièces jointes)</b></p><p>Toutes les saisies sont enregistrées automatiquement hors ligne.</p>`,`<button class="b" onclick="save();ts('Base enregistrée dans le stockage interne')">${I('check',18)} Forcer l’enregistrement interne</button>`)
 +box('cloud','2. Base de données en ligne (Supabase / cloud)',`<p>${on?'Cloud configuré'+(c.last?' · dernière synchronisation : '+new Date(c.last).toLocaleString('fr-FR'):''):'Cloud non configuré.'} Envoyez aussi une copie vers Google Drive, OneDrive, Dropbox ou par e-mail via le fichier .json.</p>`,`<button class="b l" onclick="cc()">${I('settings',16)} Configurer</button>${on?`<button class="b" onclick="cloudPush()">${I('up',16)} Envoyer vers le cloud</button><button class="b l" onclick="cloudPull()">${I('down',16)} Récupérer du cloud</button><button class="b w" onclick="cloudTest()">Tester</button>`:''}<button class="b w" onclick="sq()">Script SQL</button><button class="b l" onclick="cpj()">${I('file',16)} Copier la base (presse-papiers)</button>`)
 +box('shield','3. Conservation en lieu sûr (archive)',`<p>Dernière sauvegarde téléchargée : <b>${esc(last)}</b>.</p><p>Téléchargez une archive complète (avec les pièces jointes) à conserver sur une clé USB, un disque externe ou dans le coffre de l’établissement. Au moins une fois par semaine.</p>`,`<button class="b" onclick="bk()">${I('down',18)} Télécharger l’archive (.json)</button><button class="b l" onclick="regx()">${I('file',16)} Exporter le registre complet (Excel)</button>${can('cfg')?`<button class="b r" onclick="$('#rs').click()">${I('up',16)} Restaurer depuis un fichier</button><input id="rs" type="file" accept=".json" hidden onchange="rs(event)">`:''}`)
 +box('clock','4. Copies automatiques de l’appareil',sn.length?`<ul class="cps" style="display:block">${sn.map((s,i)=>`<li style="margin-bottom:6px"><span>${new Date(s.t).toLocaleString('fr-FR')} — ${esc(s.why)}</span>${can('cfg')?`<button style="color:var(--g1)" onclick="snapRestore(${i})">Restaurer</button>`:''}</li>`).join('')}</ul>`:`<p>Aucune copie pour le moment. Une copie est faite chaque jour et avant chaque import.</p>`,'')
 +box('trash','5. Corbeille (30 jours)',D.trash.length?`<div>${D.trash.map((x,i)=>`<div class="tx"><div class="t"><b>${esc(NM(x))}</b><small>${x._k=='ag'?'Agent':'Élève'} · supprimé le ${new Date(x.deletedAt).toLocaleDateString('fr-FR')} par ${esc(x.deletedBy||'—')}</small></div><div class="acts"><button class="b l s" onclick="trRestore('${x.id}')">Restaurer</button>${can('cfg')?`<button class="b r s" onclick="trDel('${x.id}')">${I('trash',15)}</button>`:''}</div></div>`).join('')}</div>`:`<p>La corbeille est vide. Les fiches supprimées y restent 30 jours avant d’être effacées.</p>`,'')};
const cpj=()=>{let{cloud,...r}=D;navigator.clipboard.writeText(JSON.stringify(r)).then(()=>ts('Base copiée dans le presse-papiers'),()=>ts('Copie impossible'))};
function regx(){let c=LCOLS.filter(x=>x.k!='n');let h=c.map(x=>x.l),r=D.el.map(e=>{let S=ST(e);return c.map(x=>String(lval(x,e,0,S)??''))});RP.reg={t:'Registre complet des élèves',h,r};X('reg','xls')}
function snapRestore(i){let s=snaps()[i];if(!s||!confirm('Remplacer les données actuelles par cette copie du '+new Date(s.t).toLocaleString('fr-FR')+' ?'))return;snap('Avant restauration');let n=JSON.parse(s.data);n.cloud=D.cloud;D=n;save();location.reload()}
function trRestore(id){let i=D.trash.findIndex(x=>x.id==id);if(i<0)return;let x={...D.trash[i]},k=x._k||'el';delete x._k;delete x.deletedAt;delete x.deletedBy;D.trash.splice(i,1);D[k].push(x);audit('Fiche restaurée',NM(x));sv();go('db')}
function trDel(id){let x=D.trash.find(y=>y.id==id);if(!x||!confirm('Supprimer définitivement la fiche de '+NM(x)+' et ses documents ?'))return;D.fi.filter(f=>f.el==id).forEach(f=>FS.del(f.id));D.fi=D.fi.filter(f=>f.el!=id);D.trash=D.trash.filter(y=>y.id!=id);audit('Suppression définitive',NM(x));sv();go('db')}
function rs(ev){let f=ev.target.files[0];ev.target.value='';if(!f)return;let r=new FileReader;r.onload=async()=>{try{let o=JSON.parse(r.result);if(!o.el||!o.us||!o.tf||!o.pa)throw 0;if(!confirm('Remplacer toutes les données actuelles ?'))return;snap('Avant restauration');for(let x of o._files||[])await FS.put({id:x.id,blob:await(await fetch(x.data)).blob()});delete o._files;o.cloud=D.cloud;D=o;save();location.reload()}catch(e){ts('Fichier de sauvegarde invalide')}};r.readAsText(f)}

// ---- utilisateurs
V.us=()=>PH_('Gestion des utilisateurs',`<button class="b" onclick="eu()">${I('plus',16)} Utilisateur</button>`)+`<div class="card">${D.us.map(u=>`<div class="tx"><div class="ic" style="background:${col(u.nom)}">${esc(u.nom.slice(0,2).toUpperCase())}</div><div class="t"><b>${esc(u.nom)}</b><small>${RL[u.role]} · ${AC[u.role]=='*'?'tous les droits':u.role=='lecture'?'lecture seule':AC[u.role].split(' ').filter(p=>PG[p]).map(p=>PG[p][0]).join(', ')}</small></div><div class="acts"><button class="b l s" onclick="eu('${u.id}')">${I('edit',15)}</button>${u.id!=U.id?`<button class="b r s" onclick="rm('us','${u.id}')">${I('trash',15)}</button>`:''}</div></div>`).join('')}</div>`;
function eu(id){fm('Utilisateur',[{k:'nom',l:'Nom d’utilisateur',req:1},{k:'pin',l:'Mot de passe',req:1},{k:'role',l:'Rôle',t:'sel',o:Object.entries(RL)}],D.us.find(u=>u.id==id)||{role:'caissier'},o=>{if(D.us.some(u=>u.nom==o.nom&&u.id!=o.id))return ts('Nom déjà pris'),false;if(o.id==U.id&&o.role!='admin')return ts('Vous restez administrateur'),false;up(D.us,o);go(P)})}
const _vu=V.us;V.us=()=>_vu()+`<div class="card"><h3 style="margin-top:0">Rôles et droits d’accès</h3>${TB(['Rôle','Droits'],[['Administrateur','Tout : comptes, base de données, restauration, paramètres.'],['Directeur','Élèves, paiements, mise en place, dettes et bilan, administration, base de données, tarifs.'],['Comptable','Paiements, dettes et bilan, dépenses, consultation de la liste.'],['Caissier','Enregistrer les élèves et les paiements, consulter la liste.'],['Consultation seule','Voir la liste, la mise en place, les dettes et le bilan, sans rien modifier.']])}</div>`;

lgn();
</script></body></html>
